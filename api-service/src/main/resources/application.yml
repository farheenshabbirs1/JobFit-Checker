server:
  port: 8081

spring:
  application:
    name: api-service
  datasource:
    url: ${JOBFIT_DB_URL:jdbc:postgresql://localhost:5432/jobfit}
    username: ${JOBFIT_DB_USER:jobfit}
    password: ${JOBFIT_DB_PASSWORD:jobfit}
  jpa:
    hibernate:
      ddl-auto: validate # the schema is owned by db/schema.sql, not generated here
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jobfit:
  storage:
    root: ${JOBFIT_STORAGE_ROOT:/var/jobfit/resumes}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true # exposes /actuator/health/liveness and /readiness for k8s probes
