server {
    listen 80;

    # Static React build.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Reverse-proxy API calls to api-service so the browser only ever talks to one origin.
    # "api-service" resolves via Docker Compose's built-in DNS / the k8s Service of the same
    # name -- nothing here is Docker-Compose-specific.
    location /api/ {
        proxy_pass http://api-service:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10M;
    }
}
