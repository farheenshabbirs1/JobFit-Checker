name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobfit
          POSTGRES_USER: jobfit
          POSTGRES_PASSWORD: jobfit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobfit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Apply schema
        run: psql -h localhost -U jobfit -d jobfit -f db/schema.sql
        env:
          PGPASSWORD: jobfit

      - name: Build and test all modules
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - run: npm install
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build service images
        run: |
          docker build -f api-service/Dockerfile -t jobfit-api-service .
          docker build -f parsing-service/Dockerfile -t jobfit-parsing-service .
          docker build -f analysis-service/Dockerfile -t jobfit-analysis-service .
          docker build -f frontend/Dockerfile -t jobfit-frontend ./frontend
