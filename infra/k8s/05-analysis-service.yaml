apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-service
  namespace: jobfit-checker
spec:
  replicas: 2
  selector:
    matchLabels: { app: analysis-service }
  template:
    metadata:
      labels: { app: analysis-service }
    spec:
      containers:
        - name: analysis-service
          image: ${ACR_LOGIN_SERVER}/jobfit-analysis-service:${IMAGE_TAG}
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef: { name: jobfit-config }
            - secretRef: { name: jobfit-db-credentials }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            initialDelaySeconds: 15
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: analysis-service
  namespace: jobfit-checker
spec:
  selector: { app: analysis-service }
  ports:
    - port: 8083
      targetPort: 8083
