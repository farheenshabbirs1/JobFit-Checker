# Illustrative example of a blue-green cutover for api-service -- not applied by default
# (03-api-service.yaml is the plain single-Deployment version actually referenced by CI).
#
# The pattern: run two full Deployments of the same service at once, "blue" (currently live)
# and "green" (the new version), each with its own label so they don't share pods. A Service
# selects on a *third* label, "slot", that only one of the two Deployments carries at a time.
# Deploying a new version means: apply the green Deployment with the new image tag, wait for
# its pods to pass readiness, smoke-test it directly (e.g. via a temporary port-forward or its
# own debug Service), then flip the traffic Service's selector from slot: blue to slot: green
# with one `kubectl patch`. Rollback is the same patch in reverse -- no rebuild, no waiting on
# a new rollout. GitHub Actions can drive this by templating IMAGE_TAG into the "green"
# Deployment, applying it, running a health check against it, and patching the Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service-blue
  namespace: jobfit-checker
  labels: { app: api-service, slot: blue }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-service, slot: blue }
  template:
    metadata:
      labels: { app: api-service, slot: blue }
    spec:
      containers:
        - name: api-service
          image: ${ACR_LOGIN_SERVER}/jobfit-api-service:${BLUE_IMAGE_TAG}
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: jobfit-config }
            - secretRef: { name: jobfit-db-credentials }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service-green
  namespace: jobfit-checker
  labels: { app: api-service, slot: green }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-service, slot: green }
  template:
    metadata:
      labels: { app: api-service, slot: green }
    spec:
      containers:
        - name: api-service
          image: ${ACR_LOGIN_SERVER}/jobfit-api-service:${GREEN_IMAGE_TAG}
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: jobfit-config }
            - secretRef: { name: jobfit-db-credentials }
---
# Traffic goes wherever "slot" currently points -- start with blue.
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: jobfit-checker
spec:
  selector: { app: api-service, slot: blue }
  ports:
    - port: 8081
      targetPort: 8081

# To cut over once green is verified healthy:
#   kubectl patch service api-service -n jobfit-checker -p '{"spec":{"selector":{"app":"api-service","slot":"green"}}}'
