apiVersion: v1
kind: ConfigMap
metadata:
  name: jobfit-config
  namespace: jobfit-checker
data:
  JOBFIT_DB_URL: "jdbc:postgresql://postgres:5432/jobfit"
  JOBFIT_STORAGE_ROOT: "/var/jobfit/resumes"
---
# Reference only: real credentials belong in Azure Key Vault (via the Secrets Store CSI
# driver) or a sealed secret, not committed in plain base64 like this. See
# infra/terraform/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: jobfit-db-credentials
  namespace: jobfit-checker
type: Opaque
stringData:
  JOBFIT_DB_USER: jobfit
  JOBFIT_DB_PASSWORD: jobfit
