apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resumes-storage
  namespace: jobfit-checker
spec:
  accessModes: ["ReadWriteMany"] # shared between api-service and parsing-service
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: jobfit-checker
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-service }
  template:
    metadata:
      labels: { app: api-service }
    spec:
      containers:
        - name: api-service
          image: ${ACR_LOGIN_SERVER}/jobfit-api-service:${IMAGE_TAG}
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: jobfit-config }
            - secretRef: { name: jobfit-db-credentials }
          volumeMounts:
            - name: resumes
              mountPath: /var/jobfit/resumes
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 15
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 30
      volumes:
        - name: resumes
          persistentVolumeClaim: { claimName: resumes-storage }
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: jobfit-checker
spec:
  selector: { app: api-service }
  ports:
    - port: 8081
      targetPort: 8081
