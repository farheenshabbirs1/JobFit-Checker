services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobfit
      POSTGRES_USER: jobfit
      POSTGRES_PASSWORD: jobfit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfit"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-service:
    build:
      context: ..
      dockerfile: api-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      JOBFIT_DB_URL: jdbc:postgresql://postgres:5432/jobfit
      JOBFIT_DB_USER: jobfit
      JOBFIT_DB_PASSWORD: jobfit
      JOBFIT_STORAGE_ROOT: /var/jobfit/resumes
    volumes:
      - resumes:/var/jobfit/resumes
    depends_on:
      postgres:
        condition: service_healthy

  parsing-service:
    build:
      context: ..
      dockerfile: parsing-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      JOBFIT_DB_URL: jdbc:postgresql://postgres:5432/jobfit
      JOBFIT_DB_USER: jobfit
      JOBFIT_DB_PASSWORD: jobfit
      JOBFIT_STORAGE_ROOT: /var/jobfit/resumes
    volumes:
      - resumes:/var/jobfit/resumes
    depends_on:
      postgres:
        condition: service_healthy

  analysis-service:
    build:
      context: ..
      dockerfile: analysis-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      JOBFIT_DB_URL: jdbc:postgresql://postgres:5432/jobfit
      JOBFIT_DB_USER: jobfit
      JOBFIT_DB_PASSWORD: jobfit
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    ports:
      - "8080:80"
    depends_on:
      - api-service

volumes:
  pgdata:
  # Shared between api-service (writes uploads) and parsing-service (reads them back) -- the
  # local-disk stand-in for a cloud object store, behind the BlobStorage interface.
  resumes:
